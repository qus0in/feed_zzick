<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(38,80%,96%)" />
      <stop offset="100%" style="stop-color:hsl(356,55%,93%)" />
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:hsl(356,100%,75%);stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:hsl(356,100%,75%);stop-opacity:0" />
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- ── Centered Hamster SVG ── -->
  <g transform="translate(205, -8) scale(1.3)">
    <!-- Shadow -->
    <ellipse cx="150" cy="278" rx="68" ry="9" fill="hsla(28,40%,20%,0.07)" />
    <!-- Body -->
    <path d="M 88,110 C 58,160 48,255 150,255 C 252,255 242,160 212,110 C 190,82 110,82 88,110 Z"
          fill="hsl(28,65%,86%)" />
    <!-- Belly -->
    <path d="M 98,172 C 78,202 78,250 150,250 C 222,250 222,202 202,172 C 182,152 118,152 98,172 Z"
          fill="hsl(38,60%,98%)" />
    <!-- Ears -->
    <circle cx="85"  cy="72" r="28" fill="hsl(28,55%,76%)" />
    <circle cx="85"  cy="72" r="16" fill="hsl(356,100%,88%)" />
    <circle cx="215" cy="72" r="28" fill="hsl(28,55%,76%)" />
    <circle cx="215" cy="72" r="16" fill="hsl(356,100%,88%)" />
    <!-- Big puffed cheeks (bolls maxed out) -->
    <circle cx="105" cy="184" r="30" fill="hsl(356,100%,75%)" opacity="0.82" filter="url(#soft)" />
    <circle cx="195" cy="184" r="30" fill="hsl(356,100%,75%)" opacity="0.82" filter="url(#soft)" />
    <!-- Happy arch eyes -->
    <path d="M 102,152 Q 113,138 124,152" fill="none" stroke="hsl(28,45%,15%)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 176,152 Q 187,138 198,152" fill="none" stroke="hsl(28,45%,15%)" stroke-width="5.5" stroke-linecap="round" />
    <!-- Nose -->
    <polygon points="146,156 154,156 150,162" fill="hsl(356,70%,65%)" />
    <!-- Big happy smile -->
    <path d="M 141,165 Q 150,180 159,165" fill="none" stroke="hsl(28,45%,25%)" stroke-width="3" stroke-linecap="round" />
    <!-- Paws -->
    <circle cx="108" cy="230" r="10" fill="hsl(38,60%,98%)" stroke="hsl(28,55%,78%)" stroke-width="1.5" />
    <circle cx="192" cy="230" r="10" fill="hsl(38,60%,98%)" stroke="hsl(28,55%,78%)" stroke-width="1.5" />
    <!-- Seeds stashed in cheek area -->
    <g transform="translate(56, 238) rotate(-38) scale(0.72)">
      <path d="M 0,-15 C 6,-5 10,3 9,9 C 8,13 4,14 0,14 C -4,14 -8,13 -9,9 C -10,3 -6,-5 0,-15 Z" fill="hsl(28,50%,38%)" />
      <path d="M 0,-14 C 2,-5 5,2 4.5,7 C 4,11 2,12 0,12 C -2,12 -4,11 -4.5,7 C -5,2 -2,-5 0,-14 Z" fill="hsl(38,50%,82%)" opacity="0.85"/>
    </g>
    <g transform="translate(244, 240) rotate(40) scale(0.72)">
      <path d="M 0,-15 C 6,-5 10,3 9,9 C 8,13 4,14 0,14 C -4,14 -8,13 -9,9 C -10,3 -6,-5 0,-15 Z" fill="hsl(28,50%,38%)" />
      <path d="M 0,-14 C 2,-5 5,2 4.5,7 C 4,11 2,12 0,12 C -2,12 -4,11 -4.5,7 C -5,2 -2,-5 0,-14 Z" fill="hsl(38,50%,82%)" opacity="0.85"/>
    </g>
  </g>
</svg>
